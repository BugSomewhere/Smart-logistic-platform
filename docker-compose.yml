services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_logistics
    volumes:
      - pgdata:/var/lib/postgresql/data
      
  ml-service:
    build:
      context: ./services/ml-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  pgdata:
